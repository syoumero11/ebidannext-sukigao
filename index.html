<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ EBiDANNEXT好き顔くらべ ✨</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(180deg,#f7edff,#ffffff);
  color:#432553;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

header{
  text-align:center;
  padding:18px 10px 8px;
}

h1{
  margin:0;
  color:#8a3fc4;
  font-size:clamp(22px,6vw,34px);
}

#status{
  margin-top:8px;
  font-size:14px;
  color:#76517f;
}

main{
  width:min(900px,100%);
  margin:auto;
  padding:10px 12px 35px;
}

.message{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  line-height:1.6;
  margin:14px 0;
}

.count{
  text-align:center;
  color:#8a3fc4;
  font-weight:bold;
  margin-bottom:12px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.card{
  background:#fff;
  border:3px solid #ead8f5;
  border-radius:16px;
  padding:6px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(90,40,120,.12);
  transition:.15s;
}

.card.selected{
  border-color:#9a4bd0;
  background:#f4e8fc;
  transform:translateY(-3px);
  box-shadow:0 6px 16px rgba(120,50,160,.25);
}

.card img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  display:block;
  border-radius:11px;
  background:#f6f1f8;
}

.name{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  line-height:1.3;
  padding:7px 2px 4px;
  word-break:break-all;
}

.buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

button{
  border:0;
  border-radius:999px;
  padding:13px 22px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.nextBtn{
  background:#8b42c7;
  color:white;
}

.nextBtn:disabled{
  opacity:.45;
}

.backBtn{
  background:#eee4f4;
  color:#624372;
}

.restartBtn{
  background:#8b42c7;
  color:white;
}

.resultTitle{
  text-align:center;
  color:#8b42c7;
  font-size:24px;
  font-weight:bold;
  margin:8px 0 18px;
}

.resultGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.resultCard{
  background:white;
  border:2px solid #ead8f5;
  border-radius:14px;
  padding:6px;
  box-shadow:0 4px 12px rgba(90,40,120,.10);
}

.resultCard img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  display:block;
  border-radius:10px;
  background:#f6f1f8;
}

.rank{
  text-align:center;
  color:#8b42c7;
  font-size:19px;
  font-weight:900;
  margin-top:5px;
}

.resultName{
  text-align:center;
  font-size:12px;
  font-weight:bold;
  line-height:1.3;
  min-height:32px;
  padding:3px 1px;
  word-break:break-all;
}

.center{
  text-align:center;
}

.bigMessage{
  font-size:20px;
  font-weight:bold;
  line-height:1.7;
  margin:30px 0;
  text-align:center;
}

@media(max-width:650px){

  .cards{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .resultGrid{
    grid-template-columns:repeat(3,1fr);
    gap:6px;
  }

  .resultCard{
    padding:4px;
  }

  .rank{
    font-size:16px;
  }

  .resultName{
    font-size:10px;
  }
}
</style>
</head>

<body>

<header>
  <h1>✨ EBiDANNEXT好き顔くらべ ✨</h1>
  <div id="status">準備中…</div>
</header>

<main id="app"></main>

<script src="people.js"></script>

<script>

"use strict";

/* =========================
   写真データ
========================= */

const PEOPLE = Array.isArray(window.PEOPLE)
  ? window.PEOPLE
  : [];

/*
  people.js の
  images/001.jpg
  のような指定を
  GitHub Pages のURLへ変換
*/

PEOPLE.forEach(person => {

  const fileName =
    String(person.image || "")
      .split("/")
      .pop();

  person.image =
    "https://syoumero11.github.io/ebidannext-sukigao/" +
    fileName;
});


/* =========================
   基本データ
========================= */

const app = document.getElementById("app");
const status = document.getElementById("status");

let groups = [];

for(let i = 0; i < PEOPLE.length; i += 4){
  groups.push(PEOPLE.slice(i,i+4));
}


/* =========================
   ゲーム状態
========================= */

let groupIndex = 0;

let selected = [];

let candidates = [];

let ranking = [];

let history = [];


/* =========================
   HTMLエスケープ
========================= */

function esc(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


/* =========================
   状態保存
========================= */

function save(){

  history.push({
    groupIndex:groupIndex,
    selected:selected.map(x => x.id),
    candidates:candidates.map(x => x.id),
    ranking:ranking.map(x => x.id)
  });

}


function restore(){

  if(history.length === 0){
    return false;
  }

  const state =
    history.pop();

  groupIndex =
    state.groupIndex;

  selected =
    state.selected
      .map(id => PEOPLE.find(x => x.id === id))
      .filter(Boolean);

  candidates =
    state.candidates
      .map(id => PEOPLE.find(x => x.id === id))
      .filter(Boolean);

  ranking =
    state.ranking
      .map(id => PEOPLE.find(x => x.id === id))
      .filter(Boolean);

  return true;
}


/* =========================
   戻る
========================= */

function goBack(){

  if(restore()){

    showPreliminary();

  }

}


/* =========================
   カード
========================= */

function makeCard(person,index){

  const isSelected =
    selected.some(x => x.id === person.id);

  return `
    <div
      class="card ${isSelected ? "selected" : ""}"
      onclick="togglePerson(${index})"
    >

      <img
        src="${esc(person.image)}"
        alt=""
      >

      <div class="name">
        ${esc(person.name)}
      </div>

    </div>
  `;
}


/* =========================
   選択
========================= */

function togglePerson(index){

  const group =
    groups[groupIndex];

  const person =
    group[index];

  const existing =
    selected.findIndex(
      x => x.id === person.id
    );

  if(existing >= 0){

    selected.splice(existing,1);

  }else{

    /*
      最大2人
    */

    if(selected.length >= 2){

      return;
    }

    selected.push(person);

  }

  showPreliminary(false);

}


/* =========================
   予選画面
========================= */

function showPreliminary(saveHistory = true){

  if(groupIndex >= groups.length){

    finishPreliminary();
    return;
  }

  if(saveHistory){

    /*
      現在の状態を戻れるように保存
    */

  }

  const group =
    groups[groupIndex];

  status.textContent =
    `予選 ${groupIndex + 1} / ${groups.length}`;

  app.innerHTML = `

    <div class="message">
      気になる人を
      <br>
      <strong>最大2人まで</strong>
      選んでね 💜
    </div>

    <div class="count">
      選択中：${selected.length} / 2人
    </div>

    <div class="cards">

      ${group.map((person,index) =>
        makeCard(person,index)
      ).join("")}

    </div>

    <div class="buttons">

      <button
        class="backBtn"
        onclick="goBack()"
        ${history.length === 0 ? "disabled" : ""}
      >
        ↩️ 1つ戻る
      </button>

      <button
        class="nextBtn"
        onclick="nextGroup()"
      >
        次の4人へ →
      </button>

    </div>
  `;
}


/* =========================
   次の4人
========================= */

function nextGroup(){

  /*
    現在の状態を保存
  */

  history.push({
    groupIndex:groupIndex,
    selected:selected.map(x => x.id),
    candidates:candidates.map(x => x.id),
    ranking:ranking.map(x => x.id)
  });

  /*
    選んだ人を候補に追加
  */

  selected.forEach(person => {

    if(!candidates.some(x => x.id === person.id)){

      candidates.push(person);

    }

  });

  selected = [];

  groupIndex++;

  showPreliminary(false);
}


/* =========================
   予選終了
========================= */

function finishPreliminary(){

  /*
    9人未満なら再挑戦
  */

  if(candidates.length < 9){

    status.textContent =
      "もう一度チャレンジ！";

    app.innerHTML = `

      <div class="bigMessage">

        😿 もう少しだけ！

        <br><br>

        今回は
        <strong>${candidates.length}人</strong>
        しか選ばれませんでした。

        <br>

        TOP9を作るには
        <strong>9人以上</strong>
        必要です。

        <br><br>

        💜 もう一度やって、
        気になる人を9人以上選んでみてね！

      </div>

      <div class="buttons">

        <button
          class="restartBtn"
          onclick="restart()"
        >
          🔄 もう一度挑戦する
        </button>

      </div>

    `;

    return;
  }


  /*
    9人以上なら
    FINAL9へ
  */

  startFinal9();

}


/* =========================
   FINAL9
========================= */

/*
  候補者を2人ずつ比較して、
  最終的に上位9人を決定する。

  挿入式なので必ず終了する。
*/

let finalSorted = [];

let finalQueue = [];

let finalPosition = 0;


function startFinal9(){

  finalSorted = [];

  finalQueue = [...candidates];

  finalPosition = 0;

  showFinal9();

}


function showFinal9(){

  /*
    全員処理完了
  */

  if(finalQueue.length === 0){

    /*
      上位9人
    */

    ranking =
      finalSorted.slice(0,9);

    startRanking();

    return;
  }


  /*
    最初の1人
  */

  if(finalSorted.length === 0){

    finalSorted.push(
      finalQueue.shift()
    );

    showFinal9();

    return;
  }


  /*
    現在比較する人
  */

  const person =
    finalQueue[0];


  /*
    最後まで負けた場合
  */

  if(finalPosition >= finalSorted.length){

    finalSorted.push(person);

    finalQueue.shift();

    finalPosition = 0;

    showFinal9();

    return;
  }


  const opponent =
    finalSorted[finalPosition];


  status.textContent =
    "FINAL9を決めています";


  app.innerHTML = `

    <div class="message">
      FINAL9候補を選出中 💜
      <br>
      どちらの顔が好き？
    </div>

    <div class="cards">

      ${`
        <div
          class="card"
          onclick="finalChoose(0)"
        >
          <img src="${esc(opponent.image)}">
          <div class="name">
            ${esc(opponent.name)}
          </div>
        </div>
      `}

      ${`
        <div
          class="card"
          onclick="finalChoose(1)"
        >
          <img src="${esc(person.image)}">
          <div class="name">
            ${esc(person.name)}
          </div>
        </div>
      `}

    </div>

    <div class="buttons">

      <button
        class="backBtn"
        onclick="restart()"
      >
        最初からやり直す
      </button>

    </div>
  `;
}


function finalChoose(choice){

  const person =
    finalQueue[0];

  const opponent =
    finalSorted[finalPosition];


  if(choice === 1){

    /*
      新しい人を上に入れる
    */

    finalSorted.splice(
      finalPosition,
      0,
      person
    );

    finalQueue.shift();

    finalPosition = 0;

  }else{

    /*
      次の人と比較
    */

    finalPosition++;

  }


  showFinal9();

}


/* =========================
   TOP9順位決定
========================= */

let rankQueue = [];

let rankSorted = [];

let rankPosition = 0;


function startRanking(){

  rankQueue =
    [...ranking];

  rankSorted = [];

  rankPosition = 0;

  showRanking();

}


function showRanking(){

  if(rankQueue.length === 0){

    ranking =
      rankSorted.slice(0,9);

    showResult();

    return;
  }


  if(rankSorted.length === 0){

    rankSorted.push(
      rankQueue.shift()
    );

    showRanking();

    return;
  }


  const person =
    rankQueue[0];


  if(rankPosition >= rankSorted.length){

    rankSorted.push(person);

    rankQueue.shift();

    rankPosition = 0;

    showRanking();

    return;
  }


  const opponent =
    rankSorted[rankPosition];


  status.textContent =
    `TOP9順位決定中`;

  app.innerHTML = `

    <div class="message">
      TOP9の順位を決めよう！ 💜
      <br>
      どちらの顔が好き？
    </div>

    <div class="cards">

      <div
        class="card"
        onclick="rankChoose(0)"
      >

        <img src="${esc(opponent.image)}">

        <div class="name">
          ${esc(opponent.name)}
        </div>

      </div>


      <div
        class="card"
        onclick="rankChoose(1)"
      >

        <img src="${esc(person.image)}">

        <div class="name">
          ${esc(person.name)}
        </div>

      </div>

    </div>

    <div class="buttons">

      <button
        class="backBtn"
        onclick="restart()"
      >
        最初からやり直す
      </button>

    </div>

  `;

}


function rankChoose(choice){

  const person =
    rankQueue[0];


  if(choice === 1){

    rankSorted.splice(
      rankPosition,
      0,
      person
    );

    rankQueue.shift();

    rankPosition = 0;

  }else{

    rankPosition++;

  }


  showRanking();

}


/* =========================
   結果
========================= */

function showResult(){

  status.textContent =
    "結果発表 🎉";


  /*
    必ず9人
  */

  const result =
    ranking.slice(0,9);


  app.innerHTML = `

    <div class="resultTitle">
      ✨ あなたの「好きな顔TOP9」✨
    </div>


    <div class="resultGrid">

      ${result.map((person,index) => `

        <div class="resultCard">

          <img
            src="${esc(person.image)}"
            alt=""
          >

          <div class="rank">
            ${index + 1}位
          </div>

          <div class="resultName">
            ${esc(person.name)}
          </div>

        </div>

      `).join("")}

    </div>


    <div class="buttons">

      <button
        class="restartBtn"
        onclick="restart()"
      >
        🔄 もう一度やる
      </button>

    </div>

  `;

}


/* =========================
   最初から
========================= */

function restart(){

  groupIndex = 0;

  selected = [];

  candidates = [];

  ranking = [];

  finalSorted = [];

  finalQueue = [];

  finalPosition = 0;

  rankQueue = [];

  rankSorted = [];

  rankPosition = 0;

  history = [];

  showPreliminary(false);

}


/* =========================
   開始
========================= */

if(PEOPLE.length === 0){

  status.textContent =
    "写真データを読み込めませんでした";

  app.innerHTML = `
    <div class="bigMessage">
      写真データを確認してください。
    </div>
  `;

}else{

  showPreliminary(false);

}

</script>

</body>
</html>
