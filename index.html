<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ EBiDANNEXT好き顔くらべ ✨</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f0ff;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

#app {
  max-width: 700px;
  margin: 0 auto;
  padding: 18px 12px 40px;
}

h1 {
  margin: 8px 0 10px;
  text-align: center;
  color: #7b3fc6;
  font-size: 27px;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 18px;
}

.info {
  text-align: center;
  background: white;
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  color: #666;
  font-size: 14px;
}

.people-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.person-card {
  background: white;
  border-radius: 16px;
  padding: 8px;
  box-shadow: 0 3px 10px rgba(0,0,0,.10);
  cursor: pointer;
  border: 3px solid transparent;
  transition: .15s;
}

.person-card.selected {
  border-color: #a855f7;
  background: #faf5ff;
  transform: translateY(-2px);
}

.person-card img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: contain;
  display: block;
  border-radius: 11px;
  background: #eee;
}

.person-name {
  text-align: center;
  font-weight: bold;
  font-size: 15px;
  padding: 8px 3px 4px;
  word-break: break-all;
}

.check {
  text-align: center;
  color: #9b45df;
  font-weight: bold;
  font-size: 13px;
  min-height: 18px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 15px 12px;
  margin-top: 16px;
  background: #8b4bd8;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

button.secondary {
  background: #777;
}

button.light {
  background: #eee;
  color: #555;
}

.message {
  background: white;
  border-radius: 18px;
  padding: 25px 18px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.message h2 {
  color: #7b3fc6;
  margin-top: 0;
}

.compare-card {
  background: white;
  border-radius: 18px;
  padding: 10px;
  box-shadow: 0 3px 12px rgba(0,0,0,.10);
}

.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.compare-person {
  cursor: pointer;
  border: 4px solid transparent;
  border-radius: 16px;
  padding: 7px;
  background: #fafafa;
}

.compare-person:active {
  transform: scale(.98);
}

.compare-person img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: contain;
  display: block;
  border-radius: 11px;
  background: #eee;
}

.compare-name {
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  padding: 9px 3px 5px;
  word-break: break-all;
}

.vs {
  text-align: center;
  font-weight: bold;
  color: #8b4bd8;
  margin: 12px 0;
}

.progress {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin: 8px 0 14px;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.result-card {
  background: white;
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,.09);
}

.result-card img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: contain;
  display: block;
  border-radius: 9px;
  background: #eee;
}

.rank {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  color: #7b3fc6;
  padding-top: 6px;
}

.result-name {
  text-align: center;
  font-weight: bold;
  font-size: 13px;
  padding: 4px 2px 7px;
  word-break: break-all;
}

.small-note {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 12px;
}

@media (max-width: 420px) {
  #app {
    padding-left: 9px;
    padding-right: 9px;
  }

  h1 {
    font-size: 24px;
  }

  .person-name {
    font-size: 14px;
  }

  .compare-name {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script src="people.js"></script>

<script>
"use strict";

/* =========================
   基本設定
========================= */

const BASE_URL =
  "https://syoumero11.github.io/ebidannext-sukigao/";

const app = document.getElementById("app");

let people = Array.isArray(window.PEOPLE)
  ? window.PEOPLE.map(p => {
      const fileName = String(p.image || "").split("/").pop();

      return {
        id: p.id,
        name: p.name,
        image: BASE_URL + fileName
      };
    })
  : [];

/* =========================
   状態
========================= */

let selected = [];
let currentGroupStart = 0;

let finalists = [];

let selectionQueue = [];
let selectionIndex = 0;

let finalMatches = [];
let finalMatchIndex = 0;
let finalWins = {};

let screenHistory = [];

/* =========================
   共通
========================= */

function shuffle(array) {
  const a = [...array];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getPerson(id) {
  return people.find(p => p.id === id);
}

/* =========================
   タイトル
========================= */

function titleHTML() {
  return `
    <h1>✨ EBiDANNEXT好き顔くらべ ✨</h1>
  `;
}

/* =========================
   スタート
========================= */

function startGame() {
  selected = [];
  currentGroupStart = 0;
  finalists = [];

  selectionQueue = [];
  selectionIndex = 0;

  finalMatches = [];
  finalMatchIndex = 0;
  finalWins = {};

  showPreliminary();
}

/* =========================
   予選
========================= */

function showPreliminary() {

  if (currentGroupStart >= people.length) {
    finishPreliminary();
    return;
  }

  const group = people.slice(
    currentGroupStart,
    currentGroupStart + 4
  );

  app.innerHTML = `
    ${titleHTML()}

    <div class="subtitle">
      好きな顔を0〜2人選んでね
    </div>

    <div class="info">
      ${currentGroupStart + 1}〜${Math.min(
        currentGroupStart + 4,
        people.length
      )}人目 / ${people.length}人
    </div>

    <div class="people-grid">
      ${group.map(person => `
        <div
          class="person-card"
          data-id="${person.id}"
          onclick="toggleSelect(${person.id})"
        >
          <img
            src="${person.image}"
            alt=""
            onerror="this.style.background='#ddd'"
          >

          <div class="person-name">
            ${escapeHTML(person.name)}
          </div>

          <div class="check" id="check-${person.id}"></div>
        </div>
      `).join("")}
    </div>

    <button onclick="nextGroup()">
      次の4人へ
    </button>
  `;

  updateSelectionDisplay();
}

function toggleSelect(id) {

  const index = selected.indexOf(id);

  if (index !== -1) {
    selected.splice(index, 1);
    updateSelectionDisplay();
    return;
  }

  if (selected.length >= 2) {
    return;
  }

  selected.push(id);
  updateSelectionDisplay();
}

function updateSelectionDisplay() {

  document.querySelectorAll(".person-card").forEach(card => {
    const id = Number(card.dataset.id);

    if (selected.includes(id)) {
      card.classList.add("selected");

      const check = document.getElementById("check-" + id);

      if (check) {
        check.textContent = "♥ 選択中";
      }
    } else {
      card.classList.remove("selected");

      const check = document.getElementById("check-" + id);

      if (check) {
        check.textContent = "";
      }
    }
  });
}

function nextGroup() {

  selected.forEach(id => {
    if (!finalists.some(p => p.id === id)) {
      finalists.push(getPerson(id));
    }
  });

  selected = [];
  currentGroupStart += 4;

  showPreliminary();
}

/* =========================
   予選終了
========================= */

function finishPreliminary() {

  if (finalists.length < 9) {

    app.innerHTML = `
      ${titleHTML()}

      <div class="message">
        <h2>もう少し選んでね！</h2>

        <p>
          今回は
          <strong>${finalists.length}人</strong>
          が選ばれました。
        </p>

        <p>
          最終ランキングには<br>
          <strong>9人以上</strong>
          必要です。
        </p>

        <button onclick="startGame()">
          もう一度予選する
        </button>
      </div>
    `;

    return;
  }

  if (finalists.length === 9) {
    startFinalRanking(finalists);
    return;
  }

  startFinal9Selection();
}

/* =========================
   FINAL9選出
   10人以上の場合
========================= */

/*
  10人以上の場合は、
  ランダムに9人を選ぶのではなく、
  1対1比較をして負けた人を落としていく。

  9人になった時点で終了。
*/

function startFinal9Selection() {

  let remaining = shuffle(finalists);

  selectionQueue = [];

  while (remaining.length > 9) {

    const aIndex = Math.floor(Math.random() * remaining.length);

    let bIndex = Math.floor(Math.random() * remaining.length);

    while (bIndex === aIndex) {
      bIndex = Math.floor(Math.random() * remaining.length);
    }

    selectionQueue.push({
      a: remaining[aIndex].id,
      b: remaining[bIndex].id
    });

    /*
      実際の勝敗で削除するため、
      ここでは候補者リストだけ保持する。
    */

    /*
      仮に順番を作るため、
      対戦後に毎回remainingを更新する。
      そのためqueueは使わず、
      selectionStep()で生成する。
    */

    break;
  }

  selectionQueue = [];
  selectionIndex = 0;

  selectionStep();
}

function selectionStep() {

  if (finalists.length <= 9) {
    startFinalRanking(finalists);
    return;
  }

  let aIndex = Math.floor(Math.random() * finalists.length);

  let bIndex = Math.floor(Math.random() * finalists.length);

  while (bIndex === aIndex) {
    bIndex = Math.floor(Math.random() * finalists.length);
  }

  let a = finalists[aIndex];
  let b = finalists[bIndex];

  /*
    左右を毎回ランダムにする
  */

  if (Math.random() < 0.5) {
    [a, b] = [b, a];
  }

  selectionQueue = [{
    a: a,
    b: b
  }];

  selectionIndex = 0;

  showSelectionMatch();
}

function showSelectionMatch() {

  const match = selectionQueue[selectionIndex];

  const a = match.a;
  const b = match.b;

  app.innerHTML = `
    ${titleHTML()}

    <div class="subtitle">
      FINAL9選出
    </div>

    <div class="info">
      あと ${finalists.length - 9}人を落とすと
      FINAL9です
    </div>

    <div class="compare-card">

      <div class="progress">
        ${finalists.length}人 → 9人
      </div>

      <div class="compare-grid">

        <div
          class="compare-person"
          onclick="selectionVote(${a.id}, ${b.id})"
        >
          <img src="${a.image}" alt="">
          <div class="compare-name">
            ${escapeHTML(a.name)}
          </div>
        </div>

        <div
          class="compare-person"
          onclick="selectionVote(${b.id}, ${a.id})"
        >
          <img src="${b.image}" alt="">
          <div class="compare-name">
            ${escapeHTML(b.name)}
          </div>
        </div>

      </div>

      <div class="vs">
        ← 好きな顔をタップ →
      </div>

    </div>
  `;
}

function selectionVote(winnerId, loserId) {

  finalists = finalists.filter(
    person => person.id !== loserId
  );

  /*
    9人になったら最終戦へ
  */

  if (finalists.length === 9) {
    startFinalRanking(finalists);
    return;
  }

  selectionStep();
}

/* =========================
   最終9人・総当たり
========================= */

function startFinalRanking(list) {

  finalists = [...list];

  finalWins = {};

  finalists.forEach(person => {
    finalWins[person.id] = 0;
  });

  finalMatches = [];

  /*
    全36試合を作る
  */

  for (let i = 0; i < finalists.length; i++) {

    for (let j = i + 1; j < finalists.length; j++) {

      let a = finalists[i];
      let b = finalists[j];

      /*
        左右をランダム
      */

      if (Math.random() < 0.5) {
        [a, b] = [b, a];
      }

      finalMatches.push({
        a: a.id,
        b: b.id
      });
    }
  }

  /*
    対戦順もランダム
  */

  finalMatches = shuffle(finalMatches);

  finalMatchIndex = 0;

  showFinalMatch();
}

/* =========================
   最終戦表示
========================= */

function showFinalMatch() {

  if (finalMatchIndex >= finalMatches.length) {
    finishFinalRanking();
    return;
  }

  const match = finalMatches[finalMatchIndex];

  const a = getPerson(match.a);
  const b = getPerson(match.b);

  app.innerHTML = `
    ${titleHTML()}

    <div class="subtitle">
      ✨ 最終ランキング ✨
    </div>

    <div class="progress">
      ${finalMatchIndex + 1}
      / ${finalMatches.length} 試合
    </div>

    <div class="compare-card">

      <div class="compare-grid">

        <div
          class="compare-person"
          onclick="finalVote(${a.id})"
        >
          <img src="${a.image}" alt="">
          <div class="compare-name">
            ${escapeHTML(a.name)}
          </div>
        </div>

        <div
          class="compare-person"
          onclick="finalVote(${b.id})"
        >
          <img src="${b.image}" alt="">
          <div class="compare-name">
            ${escapeHTML(b.name)}
          </div>
        </div>

      </div>

      <div class="vs">
        ← 好きな顔をタップ →
      </div>

    </div>
  `;
}

/* =========================
   最終戦投票
========================= */

function finalVote(winnerId) {

  finalWins[winnerId]++;

  finalMatchIndex++;

  showFinalMatch();
}

/* =========================
   結果
========================= */

function finishFinalRanking() {

  /*
    勝数の多い順。

    同じ勝数の場合はランダムで並べる。
    （9人全員が36試合を終えているので、
      全員同じ条件で比較されている）
  */

  const shuffled = shuffle(finalists);

  shuffled.sort((a, b) => {
    return finalWins[b.id] - finalWins[a.id];
  });

  const ranking = shuffled;

  app.innerHTML = `
    ${titleHTML()}

    <div class="subtitle">
      ✨ あなたの「好きな顔TOP9」✨
    </div>

    <div class="result-grid">

      ${ranking.map((person, index) => `
        <div class="result-card">

          <div class="rank">
            ${index + 1}位
          </div>

          <img
            src="${person.image}"
            alt=""
          >

          <div class="result-name">
            ${escapeHTML(person.name)}
          </div>

        </div>
      `).join("")}

    </div>

    <div class="small-note">
      9人で全36試合を比較しました
    </div>

    <button onclick="startGame()">
      もう一度やる
    </button>

    <button
      class="light"
      onclick="location.reload()"
    >
      最初の画面に戻る
    </button>
  `;
}

/* =========================
   初期画面
========================= */

function showStart() {

  app.innerHTML = `
    ${titleHTML()}

    <div class="message">

      <h2>好きな顔を選ぼう！</h2>

      <p>
        122人を4人ずつ見て、<br>
        好きな顔を0〜2人選んでね。
      </p>

      <p>
        予選終了後、選ばれた人の中から<br>
        最終TOP9を決めます。
      </p>

      <button onclick="startGame()">
        スタート！
      </button>

    </div>
  `;
}

showStart();
</script>

</body>
</html>
