<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✨ EBiDANNEXT好き顔くらべ ✨</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:linear-gradient(180deg,#f8efff,#ffffff);
  color:#3b2450;
}

header{
  padding:18px 12px 10px;
  text-align:center;
}

h1{
  margin:0;
  font-size:clamp(22px,6vw,34px);
  color:#8b42c7;
}

#status{
  margin-top:8px;
  font-size:14px;
  color:#765681;
}

main{
  width:min(100%,900px);
  margin:auto;
  padding:10px 12px 30px;
}

.question{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:12px 0 16px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.card{
  background:white;
  border:2px solid #ead7f7;
  border-radius:16px;
  padding:7px;
  box-shadow:0 4px 12px rgba(100,50,130,.10);
  cursor:pointer;
  transition:.15s;
}

.card:active{
  transform:scale(.97);
}

.card img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  display:block;
  border-radius:11px;
  background:#f7f2fa;
}

.name{
  text-align:center;
  font-size:14px;
  font-weight:bold;
  padding:8px 2px 4px;
  line-height:1.3;
  word-break:break-all;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

button{
  border:0;
  border-radius:999px;
  padding:12px 22px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.backBtn{
  background:#eee4f4;
  color:#634575;
}

.backBtn:disabled{
  opacity:.4;
  cursor:default;
}

.restartBtn{
  background:#8b42c7;
  color:white;
}

.resultTitle{
  text-align:center;
  font-size:24px;
  color:#8b42c7;
  margin:10px 0 18px;
}

.resultGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.resultCard{
  background:white;
  border:2px solid #ead7f7;
  border-radius:15px;
  padding:7px;
  box-shadow:0 4px 12px rgba(100,50,130,.10);
}

.resultCard img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  display:block;
  border-radius:10px;
  background:#f7f2fa;
}

.rank{
  text-align:center;
  font-size:20px;
  font-weight:900;
  color:#8b42c7;
  margin-top:6px;
}

.resultName{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  line-height:1.3;
  min-height:34px;
  padding:3px 1px;
  word-break:break-all;
}

@media(max-width:650px){
  .cards{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .question{
    font-size:18px;
  }

  .card .name{
    font-size:13px;
  }

  .resultGrid{
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }

  .resultCard{
    padding:5px;
    border-radius:12px;
  }

  .rank{
    font-size:16px;
  }

  .resultName{
    font-size:11px;
  }
}

@media(max-width:360px){
  .resultGrid{
    gap:5px;
  }

  .resultName{
    font-size:10px;
  }
}
</style>
</head>

<body>

<header>
  <h1>✨ EBiDANNEXT好き顔くらべ ✨</h1>
  <div id="status">読み込み中…</div>
</header>

<main id="app"></main>

<script src="people.js"></script>

<script>
"use strict";

const PEOPLE = Array.isArray(window.PEOPLE) ? window.PEOPLE : [];

/*
  people.js の
  images/001.jpg
  のような指定を、
  GitHub Pages の実際の画像URLに変換
*/
PEOPLE.forEach(person => {
  const fileName = String(person.image || "").split("/").pop();

  person.image =
    "https://syoumero11.github.io/ebidannext-sukigao/" +
    fileName;
});

const app = document.getElementById("app");
const status = document.getElementById("status");

/* -----------------------------
   ゲーム状態
----------------------------- */

let phase = "preliminary";

/* 予選 */
let groupIndex = 0;
let winners = [];

/* FINAL9 */
let finalistCandidates = [];
let finalistIndex = 0;
let finalists = [];

/* TOP9 */
let rankingCandidates = [];
let rankingIndex = 0;
let ranking = [];

/* 戻る用 */
let history = [];


/* -----------------------------
   122人 → 4人ずつ
----------------------------- */

function makeGroups(){
  const groups = [];

  for(let i = 0; i < PEOPLE.length; i += 4){
    groups.push(PEOPLE.slice(i, i + 4));
  }

  return groups;
}

const groups = makeGroups();


/* -----------------------------
   状態保存
----------------------------- */

function saveState(){
  history.push(JSON.stringify({
    phase,
    groupIndex,
    winners,
    finalistCandidates,
    finalistIndex,
    finalists,
    rankingCandidates,
    rankingIndex,
    ranking
  }));
}

function restoreState(){
  if(history.length === 0) return;

  const s = JSON.parse(history.pop());

  phase = s.phase;
  groupIndex = s.groupIndex;
  winners = s.winners;
  finalistCandidates = s.finalistCandidates;
  finalistIndex = s.finalistIndex;
  finalists = s.finalists;
  rankingCandidates = s.rankingCandidates;
  rankingIndex = s.rankingIndex;
  ranking = s.ranking;

  render();
}


/* -----------------------------
   共通UI
----------------------------- */

function esc(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function cardHTML(person, onclick){
  return `
    <div class="card" onclick="${onclick}">
      <img src="${esc(person.image)}" alt="">
      <div class="name">${esc(person.name)}</div>
    </div>
  `;
}

function buttonsHTML(){
  return `
    <div class="buttons">
      <button class="backBtn"
        onclick="goBack()"
        ${history.length === 0 ? "disabled" : ""}>
        ↩️ 1つ戻る
      </button>
    </div>
  `;
}


/* -----------------------------
   予選
----------------------------- */

function renderPreliminary(){

  if(groupIndex >= groups.length){
    startFinal9();
    return;
  }

  const group = groups[groupIndex];

  status.textContent =
    `予選 ${groupIndex + 1} / ${groups.length}`;

  app.innerHTML = `
    <div class="question">
      この中で一番好きな顔を選んでね 💜
    </div>

    <div class="cards">
      ${group.map((person,i) =>
        cardHTML(person,`choosePreliminary(${i})`)
      ).join("")}
    </div>

    ${buttonsHTML()}
  `;
}

function choosePreliminary(index){

  saveState();

  const group = groups[groupIndex];

  winners.push(group[index]);

  groupIndex++;

  render();
}


/* -----------------------------
   FINAL9開始
----------------------------- */

function startFinal9(){

  phase = "final9";

  finalistCandidates = [...winners];
  finalistIndex = 0;
  finalists = [];

  renderFinal9();
}


/*
  31人前後の予選勝者から
  好み順に並べながら上位9人を残す
*/
function renderFinal9(){

  if(finalistCandidates.length === 0){
    startRanking();
    return;
  }

  /*
    最初の1人
  */
  if(finalists.length === 0){
    finalists.push(finalistCandidates[0]);
    finalistIndex = 1;
  }

  if(finalistIndex >= finalistCandidates.length){
    startRanking();
    return;
  }

  const candidate = finalistCandidates[finalistIndex];

  /*
    比較位置を保持
  */
  if(!renderFinal9.position){
    renderFinal9.position = 0;
  }

  let pos = renderFinal9.position;

  if(pos >= finalists.length){

    if(finalists.length < 9){
      finalists.push(candidate);
    }

    finalistIndex++;
    renderFinal9.position = 0;

    renderFinal9();
    return;
  }

  status.textContent =
    `FINAL9選出　${finalistIndex} / ${finalistCandidates.length}`;

  const target = finalists[pos];

  app.innerHTML = `
    <div class="question">
      どちらの顔が好き？ 💜
    </div>

    <div class="cards">
      ${cardHTML(target,`chooseFinal9(0)`)}
      ${cardHTML(candidate,`chooseFinal9(1)`)}
    </div>

    ${buttonsHTML()}
  `;
}

function chooseFinal9(choice){

  saveState();

  const candidate = finalistCandidates[finalistIndex];
  const pos = renderFinal9.position || 0;

  if(choice === 1){

    finalists.splice(pos,0,candidate);

    if(finalists.length > 9){
      finalists.pop();
    }

    finalistIndex++;
    renderFinal9.position = 0;

  }else{

    renderFinal9.position = pos + 1;
  }

  renderFinal9();
}


/* -----------------------------
   TOP9ランキング
----------------------------- */

function startRanking(){

  phase = "ranking";

  ranking = [];
  rankingCandidates = [...finalists];
  rankingIndex = 0;

  renderRanking();
}

function renderRanking(){

  if(rankingCandidates.length === 0){
    showResult();
    return;
  }

  const candidate = rankingCandidates[rankingIndex];

  if(ranking.length === 0){

    ranking.push(candidate);
    rankingIndex++;

    renderRanking();
    return;
  }

  if(!renderRanking.position){
    renderRanking.position = 0;
  }

  const pos = renderRanking.position;

  /*
    最後まで負けたら一番下
  */
  if(pos >= ranking.length){

    ranking.push(candidate);

    rankingIndex++;
    renderRanking.position = 0;

    renderRanking();
    return;
  }

  const target = ranking[pos];

  status.textContent =
    `TOP9順位決定　${rankingIndex + 1} / ${rankingCandidates.length}`;

  app.innerHTML = `
    <div class="question">
      どちらの顔が好き？ 💜
    </div>

    <div class="cards">
      ${cardHTML(target,`chooseRanking(0)`)}
      ${cardHTML(candidate,`chooseRanking(1)`)}
    </div>

    ${buttonsHTML()}
  `;
}

function chooseRanking(choice){

  saveState();

  const candidate = rankingCandidates[rankingIndex];
  const pos = renderRanking.position || 0;

  if(choice === 1){

    ranking.splice(pos,0,candidate);

    rankingIndex++;
    renderRanking.position = 0;

  }else{

    renderRanking.position = pos + 1;
  }

  renderRanking();
}


/* -----------------------------
   結果
----------------------------- */

function showResult(){

  phase = "result";

  status.textContent = "結果発表 🎉";

  /*
    念のため必ず9人にする
  */
  const result = ranking.slice(0,9);

  app.innerHTML = `
    <div class="resultTitle">
      ✨ あなたの「好きな顔TOP9」✨
    </div>

    <div class="resultGrid">
      ${result.map((person,index) => `
        <div class="resultCard">
          <img src="${esc(person.image)}" alt="">
          <div class="rank">${index + 1}位</div>
          <div class="resultName">${esc(person.name)}</div>
        </div>
      `).join("")}
    </div>

    <div class="buttons">
      <button class="restartBtn" onclick="restartGame()">
        🔄 もう一度やる
      </button>
    </div>
  `;
}


/* -----------------------------
   戻る
----------------------------- */

function goBack(){

  /*
    比較位置も戻す必要があるため、
    保存した状態に加えて表示位置も復元
  */

  if(history.length === 0) return;

  const oldFinalPos =
    history.length > 0 ? renderFinal9.position : 0;

  const oldRankPos =
    history.length > 0 ? renderRanking.position : 0;

  restoreState();

  /*
    状態復元後に必要なら位置を安全に初期化
  */
  if(phase === "final9"){
    if(typeof renderFinal9.position !== "number"){
      renderFinal9.position = 0;
    }
  }

  if(phase === "ranking"){
    if(typeof renderRanking.position !== "number"){
      renderRanking.position = 0;
    }
  }

  render();
}


/* -----------------------------
   最初から
----------------------------- */

function restartGame(){

  phase = "preliminary";

  groupIndex = 0;
  winners = [];

  finalistCandidates = [];
  finalistIndex = 0;
  finalists = [];

  rankingCandidates = [];
  rankingIndex = 0;
  ranking = [];

  history = [];

  renderFinal9.position = 0;
  renderRanking.position = 0;

  render();
}


/* -----------------------------
   描画
----------------------------- */

function render(){

  if(PEOPLE.length === 0){
    status.textContent = "写真データが読み込めませんでした";
    app.innerHTML = `
      <div style="text-align:center;padding:30px;">
        写真データを確認してください。
      </div>
    `;
    return;
  }

  if(phase === "preliminary"){
    renderPreliminary();
  }else if(phase === "final9"){
    renderFinal9();
  }else if(phase === "ranking"){
    renderRanking();
  }else if(phase === "result"){
    showResult();
  }
}


/* -----------------------------
   開始
----------------------------- */

render();

</script>

</body>
</html>
