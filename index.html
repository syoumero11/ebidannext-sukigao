<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>✨ EBiDANNEXT好き顔くらべ ✨</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(180deg,#f3e7ff,#fff);
  color:#392447;
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
}

main{
  width:min(760px,100%);
  margin:auto;
  padding:14px 10px 40px;
}

h1{
  text-align:center;
  color:#7b4bb7;
  font-size:24px;
  margin:6px 0;
}

.status{
  text-align:center;
  font-size:13px;
  opacity:.7;
  margin-bottom:10px;
}

.progress{
  height:8px;
  background:#e5d8f2;
  border-radius:99px;
  overflow:hidden;
  margin-bottom:18px;
}

.bar{
  height:100%;
  width:0;
  background:#a56cdd;
  transition:.2s;
}

.question{
  text-align:center;
  font-size:20px;
  font-weight:900;
  line-height:1.45;
  margin:12px 0 16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.card{
  appearance:none;
  border:2px solid #eadcf7;
  background:#fff;
  border-radius:18px;
  padding:7px;
  box-shadow:0 4px 14px #5b397515;
  cursor:pointer;
  width:100%;
  color:#392447;
}

.card:active{
  transform:scale(.985);
}

.card img{
  display:block;
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  background:#faf8fc;
  border-radius:12px;
}

.name{
  text-align:center;
  font-weight:800;
  font-size:14px;
  padding:8px 2px 4px;
  overflow-wrap:anywhere;
}

.result{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.rank{
  display:grid;
  grid-template-columns:42px 96px 1fr;
  align-items:center;
  gap:9px;
  background:#fff;
  border-radius:16px;
  padding:8px;
  box-shadow:0 3px 12px #5b397515;
}

.rank img{
  width:96px;
  height:120px;
  object-fit:contain;
  border-radius:10px;
  background:#faf8fc;
}

.num{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:#7b4bb7;
}

.result-name{
  font-weight:800;
  overflow-wrap:anywhere;
}

.btn{
  width:100%;
  border:0;
  border-radius:16px;
  background:#7b4bb7;
  color:white;
  font-weight:900;
  font-size:17px;
  padding:14px;
  margin-top:14px;
}

@media(max-width:430px){
  h1{
    font-size:22px;
  }

  .question{
    font-size:18px;
  }

  .grid{
    gap:7px;
  }

  .card{
    padding:5px;
  }

  .name{
    font-size:13px;
  }

  .rank{
    grid-template-columns:32px 78px 1fr;
  }

  .rank img{
    width:78px;
    height:100px;
  }
}
</style>
</head>

<body>

<main>

<h1>✨ EBiDANNEXT好き顔くらべ ✨</h1>

<div class="status" id="status">読み込み中…</div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<section id="game"></section>

<section id="result" hidden></section>

</main>

<script src="people.js"></script>

<script>

const PEOPLE = window.PEOPLE || [];

const game = document.getElementById("game");
const result = document.getElementById("result");
const statusBox = document.getElementById("status");
const bar = document.getElementById("bar");

/*
  people.js の
  images/001.jpg
  images/002.jpg
  などを、GitHub Pages上の実際の画像URLに変換する。
*/
PEOPLE.forEach(function(person){

  const fileName = String(person.image).split("/").pop();

  person.image =
    "https://syoumero11.github.io/ebidannext-sukigao/" +
    fileName;
});


let pool = [];
let winners = [];
let finalists = [];
let ranking = [];

let groupIndex = 0;


/* ------------------------------
   ランダム
------------------------------ */

function shuffle(array){

  const a = array.slice();

  for(let i=a.length-1;i>0;i--){

    const j =
      Math.floor(Math.random()*(i+1));

    const temp = a[i];

    a[i] = a[j];
    a[j] = temp;
  }

  return a;
}


/* ------------------------------
   HTMLエスケープ
------------------------------ */

function escapeHTML(text){

  return String(text).replace(
    /[&<>"']/g,
    function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c];

    }
  );
}


/* ------------------------------
   進捗バー
------------------------------ */

function setProgress(current,total){

  if(!total){
    bar.style.width = "0%";
    return;
  }

  const percent =
    Math.round(current / total * 100);

  bar.style.width =
    Math.max(0,Math.min(100,percent)) + "%";
}


/* ------------------------------
   カード作成
------------------------------ */

function createCard(person,callback){

  const button =
    document.createElement("button");

  button.className = "card";
  button.type = "button";

  const img =
    document.createElement("img");

  img.src = person.image;
  img.alt = "";

  const name =
    document.createElement("div");

  name.className = "name";
  name.textContent = person.name;

  button.appendChild(img);
  button.appendChild(name);

  button.onclick = function(){

    callback(person);
  };

  return button;
}


/* ------------------------------
   スタート
------------------------------ */

function start(){

  if(PEOPLE.length === 0){

    statusBox.textContent =
      "写真データを読み込めませんでした。";

    game.innerHTML =
      "<div class='question'>people.jsを確認してください。</div>";

    return;
  }

  pool = shuffle(PEOPLE);

  winners = [];
  finalists = [];
  ranking = [];

  groupIndex = 0;

  result.hidden = true;
  game.hidden = false;

  showPreliminary();
}


/* ------------------------------
   予選
   122人 → 4人ずつ
------------------------------ */

function showPreliminary(){

  const startIndex =
    groupIndex * 4;

  const group =
    pool.slice(startIndex,startIndex + 4);

  const totalGroups =
    Math.ceil(pool.length / 4);

  statusBox.textContent =
    "予選 " +
    (groupIndex + 1) +
    " / " +
    totalGroups;

  game.innerHTML =
    '<div class="question">' +
    "この" +
    group.length +
    "人の中で<br>一番好きな顔は？" +
    "</div>";

  const grid =
    document.createElement("div");

  grid.className = "grid";

  group.forEach(function(person){

    grid.appendChild(
      createCard(person,choosePreliminary)
    );

  });

  game.appendChild(grid);

  setProgress(
    groupIndex,
    totalGroups
  );
}


function choosePreliminary(person){

  winners.push(person);

  groupIndex++;

  const totalGroups =
    Math.ceil(pool.length / 4);

  if(groupIndex < totalGroups){

    showPreliminary();

  }else{

    selectFinalists();
  }
}


/* ------------------------------
   予選勝者からTOP9候補を選ぶ
------------------------------ */

function selectFinalists(){

  let current =
    shuffle(winners);

  function round(){

    if(current.length <= 9){

      finalists = current;

      rankFinalists();

      return;
    }

    const next = [];

    let i = 0;

    function compare(){

      if(i >= current.length){

        current = shuffle(next);

        round();

        return;
      }

      /*
        奇数で最後に1人余った場合は
        そのまま次へ進める。
      */
      if(i === current.length - 1){

        next.push(current[i]);

        i++;

        compare();

        return;
      }

      const a = current[i];
      const b = current[i + 1];

      statusBox.textContent =
        "最終候補9人を選出中";

      game.innerHTML =
        '<div class="question">' +
        "この2人から<br>残したい方は？" +
        "</div>";

      const grid =
        document.createElement("div");

      grid.className = "grid";

      grid.appendChild(
        createCard(a,function(person){

          next.push(person);

          i += 2;

          compare();
        })
      );

      grid.appendChild(
        createCard(b,function(person){

          next.push(person);

          i += 2;

          compare();
        })
      );

      game.appendChild(grid);
    }

    compare();
  }

  round();
}


/* ------------------------------
   TOP9順位決定
------------------------------ */

function rankFinalists(){

  ranking = [];

  const order =
    shuffle(finalists);

  let index = 0;

  function nextPerson(){

    if(index >= order.length){

      showResult();

      return;
    }

    const person =
      order[index];

    index++;

    if(ranking.length === 0){

      ranking.push(person);

      nextPerson();

      return;
    }

    let position = 0;

    function compare(){

      if(position >= ranking.length){

        ranking.push(person);

        nextPerson();

        return;
      }

      const other =
        ranking[position];

      statusBox.textContent =
        "TOP9順位決定　" +
        index +
        " / 9";

      game.innerHTML =
        '<div class="question">' +
        "どちらの顔がより好き？" +
        "</div>";

      const grid =
        document.createElement("div");

      grid.className = "grid";

      grid.appendChild(
        createCard(person,function(){

          ranking.splice(
            position,
            0,
            person
          );

          nextPerson();
        })
      );

      grid.appendChild(
        createCard(other,function(){

          position++;

          compare();
        })
      );

      game.appendChild(grid);
    }

    compare();
  }

  nextPerson();
}


/* ------------------------------
   結果
------------------------------ */

function showResult(){

  game.hidden = true;

  result.hidden = false;

  statusBox.textContent =
    "結果発表";

  bar.style.width =
    "100%";

  let html =
    '<div class="question">' +
    '✨ あなたの「好きな顔TOP9」✨' +
    "</div>";

  html +=
    '<div class="result">';

  ranking.forEach(function(person,index){

    html +=
      '<div class="rank">' +

      '<div class="num">' +
      (index + 1) +
      "位</div>" +

      '<img src="' +
      person.image +
      '" alt="">' +

      '<div class="result-name">' +
      escapeHTML(person.name) +
      "</div>" +

      "</div>";
  });

  html +=
    "</div>" +

    '<button class="btn" type="button" onclick="start()">' +
    "もう一度遊ぶ" +
    "</button>";

  result.innerHTML = html;
}


/* ------------------------------
   起動
------------------------------ */

start();

</script>

</body>
</html>
