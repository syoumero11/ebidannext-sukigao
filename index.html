<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>✨ EBiDANNEXT好き顔くらべ ✨</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#f3e7ff,#fff);
  color:#392447;
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
}

main{
  max-width:760px;
  margin:auto;
  padding:16px 10px 40px;
}

h1{
  text-align:center;
  color:#7b4bb7;
  font-size:24px;
  margin:8px 0 6px;
}

#status{
  text-align:center;
  font-size:13px;
  opacity:.7;
  margin-bottom:12px;
}

.progress{
  height:8px;
  background:#e5d8f2;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.bar{
  height:100%;
  width:0;
  background:#a56cdd;
  transition:.2s;
}

.question{
  text-align:center;
  font-size:20px;
  font-weight:900;
  margin:12px 0 16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  border:2px solid #eadcf7;
  background:white;
  border-radius:18px;
  padding:7px;
  box-shadow:0 4px 14px #5b397515;
  cursor:pointer;
}

.card img{
  display:block;
  width:100%;
  aspect-ratio:3/4;
  object-fit:contain;
  background:#faf8fc;
  border-radius:12px;
}

.name{
  text-align:center;
  font-weight:800;
  font-size:14px;
  padding:8px 2px 4px;
  overflow-wrap:anywhere;
}

.start{
  display:block;
  width:100%;
  border:0;
  border-radius:18px;
  background:#7b4bb7;
  color:white;
  font-weight:900;
  font-size:18px;
  padding:15px;
  margin-top:18px;
}

.rank{
  display:grid;
  grid-template-columns:45px 90px 1fr;
  align-items:center;
  gap:9px;
  background:white;
  border-radius:16px;
  padding:8px;
  margin-bottom:9px;
}

.rank img{
  width:90px;
  height:115px;
  object-fit:contain;
  border-radius:10px;
  background:#faf8fc;
}

.num{
  text-align:center;
  font-size:18px;
  font-weight:900;
  color:#7b4bb7;
}

.result-name{
  font-weight:800;
}

@media(max-width:430px){
  h1{font-size:22px}
  .question{font-size:18px}
  .card{padding:5px}
  .name{font-size:13px}
  .rank{
    grid-template-columns:32px 76px 1fr;
  }
  .rank img{
    width:76px;
    height:98px;
  }
}
</style>
</head>

<body>
<main>

<h1>✨ EBiDANNEXT好き顔くらべ ✨</h1>

<div id="status">読み込み中…</div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<section id="game"></section>
<section id="result"></section>

</main>

<script src="people.js"></script>

<script>
const people = window.PEOPLE || [];
people.forEach(function(p){p.image=p.image.replace(/^images\//,"");});

const game = document.getElementById("game");

const game = document.getElementById("game");
const result = document.getElementById("result");
const statusText = document.getElementById("status");
const bar = document.getElementById("bar");

let pool = [];
let winners = [];
let finalists = [];
let ranking = [];
let index = 0;

function shuffle(array){
  const a = array.slice();

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}

function progress(value,total){
  if(!total)return;
  bar.style.width=Math.round(value/total*100)+"%";
}

function makeCard(person,callback){

  const button=document.createElement("button");

  button.className="card";
  button.type="button";

  button.innerHTML=
    '<img src="'+person.image+'" alt="">' +
    '<div class="name">'+escapeHTML(person.name)+'</div>';

  button.onclick=function(){
    callback(person);
  };

  return button;
}

function start(){

  if(people.length===0){
    statusText.textContent="people.jsを読み込めませんでした";
    game.innerHTML=
      "<div class='question'>写真データを確認してください。</div>";
    return;
  }

  pool=shuffle(people);
  winners=[];
  finalists=[];
  ranking=[];
  index=0;

  result.innerHTML="";
  result.hidden=true;
  game.hidden=false;

  showPreliminary();
}

function showPreliminary(){

  const group=pool.slice(index,index+4);

  statusText.textContent=
    "予選 "+(Math.floor(index/4)+1)+" / "+Math.ceil(pool.length/4);

  game.innerHTML=
    '<div class="question">この'+group.length+'人の中で<br>一番好きな顔は？</div>';

  const grid=document.createElement("div");
  grid.className="grid";

  group.forEach(function(person){
    grid.appendChild(
      makeCard(person,choosePreliminary)
    );
  });

  game.appendChild(grid);

  progress(index,pool.length);
}

function choosePreliminary(person){

  winners.push(person);

  index+=4;

  if(index<pool.length){
    showPreliminary();
  }else{
    chooseFinalists();
  }
}

function chooseFinalists(){

  let current=shuffle(winners);

  function round(){

    if(current.length<=9){
      finalists=current;
      makeRanking();
      return;
    }

    const next=[];
    let i=0;

    function compare(){

      if(i>=current.length){
        current=shuffle(next);
        round();
        return;
      }

      if(i===current.length-1){
        next.push(current[i]);
        i++;
        compare();
        return;
      }

      const a=current[i];
      const b=current[i+1];

      statusText.textContent="最終候補9人を選出中";

      game.innerHTML=
        '<div class="question">この2人から<br>残したい方は？</div>';

      const grid=document.createElement("div");
      grid.className="grid";

      grid.appendChild(
        makeCard(a,function(person){
          next.push(person);
          i+=2;
          compare();
        })
      );

      grid.appendChild(
        makeCard(b,function(person){
          next.push(person);
          i+=2;
          compare();
        })
      );

      game.appendChild(grid);
    }

    compare();
  }

  round();
}

function makeRanking(){

  ranking=[];

  const order=shuffle(finalists);

  let i=0;

  function nextPerson(){

    if(i>=order.length){
      showResult();
      return;
    }

    const person=order[i];

    i++;

    if(ranking.length===0){
      ranking.push(person);
      nextPerson();
      return;
    }

    let position=0;

    function compare(){

      if(position>=ranking.length){
        ranking.push(person);
        nextPerson();
        return;
      }

      const other=ranking[position];

      statusText.textContent=
        "TOP9順位決定　"+i+" / 9";

      game.innerHTML=
        '<div class="question">どちらの顔がより好き？</div>';

      const grid=document.createElement("div");
      grid.className="grid";

      grid.appendChild(
        makeCard(person,function(){
          ranking.splice(position,0,person);
          nextPerson();
        })
      );

      grid.appendChild(
        makeCard(other,function(){
          position++;
          compare();
        })
      );

      game.appendChild(grid);
    }

    compare();
  }

  nextPerson();
}

function showResult(){

  game.hidden=true;
  result.hidden=false;

  statusText.textContent="結果発表";
  bar.style.width="100%";

  let html=
    '<div class="question">✨ あなたの「好きな顔TOP9」✨</div>';

  ranking.forEach(function(person,i){

    html+=
      '<div class="rank">' +
        '<div class="num">'+(i+1)+"位</div>" +
        '<img src="'+person.image+'" alt="">' +
        '<div class="result-name">'+
          escapeHTML(person.name)+
        "</div>" +
      "</div>";
  });

  html+=
    '<button class="start" onclick="start()">もう一度遊ぶ</button>';

  result.innerHTML=html;
}

start();
</script>

<div style="text-align:center;padding:20px">
  写真テスト
  <br>
  <img src="001.jpg" style="width:200px">
</div>

</body>
</html>
